<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Сквиш Кликер</title>
  <link rel="stylesheet" href="style.css">
  <!-- Yandex Games SDK: на Яндекс Играх файл /sdk.js отдаёт сама платформа.
       Локально он не найдётся — это нормально, игра работает и без него. -->
  <script src="/sdk.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="wallet">
        <div class="wallet-main"><i class="coin big"></i><span id="coins">0</span></div>
        <div class="wallet-rates"><span id="perTap"></span><span class="dot">•</span><span id="perSec"></span></div>
      </div>
      <button id="soundBtn" class="icon-btn" type="button">🔊</button>
    </header>

    <main id="stage" class="stage">
      <div id="squishName" class="squish-name"></div>
      <div class="squish-area">
        <div class="squish-holder">
          <div id="shadow" class="squish-shadow"></div>
          <div id="squish" class="squish"></div>
        </div>
      </div>
      <div class="stage-actions">
        <button id="boostBtn" class="boost-btn" type="button">
          <span class="boost-icon">&#9654;&#xFE0E;</span>
          <span class="boost-text"><b id="boostMain"></b><small id="boostSub"></small></span>
        </button>
        <div id="multChip" class="mult-chip"></div>
      </div>
      <div id="fx" class="fx"></div>
    </main>

    <section class="panel">
      <nav class="tabs">
        <button id="tabUpgrades" class="tab active" type="button"></button>
        <button id="tabCollection" class="tab" type="button"></button>
      </nav>
      <div id="upgrades" class="tab-body list"></div>
      <div id="collection" class="tab-body hidden"></div>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="modalBtn" class="btn-primary" type="button"></button>
    </div>
  </div>

  <div id="confetti" class="confetti-layer"></div>

  <div id="loader" class="loader">
    <div class="loader-blob"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/squishes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/yandex.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
